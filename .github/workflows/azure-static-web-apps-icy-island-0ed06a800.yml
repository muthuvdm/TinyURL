name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v4

      # 🔧 Build Angular manually (important)
      - name: Build Angular App
        working-directory: TinyURLAngular/tiny-url-ui
        run: |
          npm install
          npm run build -- --configuration production

      # 🚀 Deploy using built output
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_ISLAND_0ED06A800 }}
          action: "upload"

          # Root folder (repo)
          app_location: "."

          # No API
          api_location: ""

          # IMPORTANT: point directly to built Angular output
          app_artifact_location: "TinyURLAngular/tiny-url-ui/dist/tiny-url-ui"
